<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Find Your Team</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/find_your_team_base.css">
    <link rel="stylesheet" href="/static/css/find_your_team_components.css">
    <style>
        .auth-container {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--sa-green) 0%, var(--sa-green-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-card {
            background: white;
            padding: 48px;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-xl);
            width: 100%;
            max-width: 450px;
        }
        
        .auth-card h1 {
            text-align: center;
            margin-bottom: 32px;
            color: var(--text-primary);
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .form-group input {
            width: 100%;
            padding: 16px;
            border: 2px solid #e9ecef;
            border-radius: var(--border-radius-sm);
            font-size: 16px;
            transition: var(--transition);
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .auth-links {
            text-align: center;
            margin-top: 24px;
        }
        
        .auth-links a {
            color: var(--primary-color);
            text-decoration: none;
        }
        
        .auth-links a:hover {
            text-decoration: underline;
        }
        
        #error-message {
            display: none;
            background: #fff2f2;
            color: #d32f2f;
            padding: 12px;
            border-radius: var(--border-radius-sm);
            margin-bottom: 16px;
            text-align: center;
        }
        
        #success-message {
            display: none;
            background: #f2fff2;
            color: #2e7d32;
            padding: 12px;
            border-radius: var(--border-radius-sm);
            margin-bottom: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>Welcome Back</h1>
            
            <div id="error-message"></div>
            <div id="success-message"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                    <span>Login</span>
                </button>
            </form>
            
            <div class="auth-links">
                <p>Don't have an account? <a href="/signup">Sign up here</a></p>
                <p><a href="/">← Back to Home</a></p>
                <br>
                <p><small><strong>Demo Account:</strong><br>Email: demo@findyourteam.com<br>Password: demo123</small></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Store user data
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('token', data.token);
                    
                    // Show success and redirect
                    document.getElementById('success-message').style.display = 'block';
                    document.getElementById('success-message').textContent = 'Login successful! Redirecting...';
                    
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    document.getElementById('error-message').style.display = 'block';
                    document.getElementById('error-message').textContent = data.error || 'Login failed';
                }
            } catch (error) {
                document.getElementById('error-message').style.display = 'block';
                document.getElementById('error-message').textContent = 'An error occurred. Please try again.';
            }
        });
    </script>
</body>
</html>
